services:
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wpuser
      MYSQL_PASSWORD: wppass
    volumes:
      - db_data_validation:/var/lib/mysql
    container_name: tshirtswiss-validation-db

  wordpress:
    image: wordpress:6.8.2-php8.2-apache
    depends_on:
      - db
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wpuser
      WORDPRESS_DB_PASSWORD: wppass
    volumes:
      - wordpress_data_validation:/var/www/html
      - ./scripts:/scripts
      - ./exports:/exports
      - ./plugins:/var/www/html/wp-content/plugins
    container_name: tshirtswiss-validation-wordpress
    ports:
      - "8089:80"

  wpcli:
    image: wordpress:cli-php8.2
    depends_on:
      - wordpress
      - db
    volumes:
      - wordpress_data_validation:/var/www/html
      - ./scripts:/scripts
      - ./exports:/exports
      - ./plugins:/var/www/html/wp-content/plugins
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wpuser
      WORDPRESS_DB_PASSWORD: wppass
    container_name: tshirtswiss-validation-wpcli
    user: "0:0"

volumes:
  db_data_validation:
  wordpress_data_validation:
