name: Apply product child V3 menus

on:
  push:
    paths:
      - 'scripts/update_product_child_v3_menus.py'
      - '.github/workflows/apply-product-child-v3-menus.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-product-child-v3-menus:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply product child V3 menu updates
        run: python3 scripts/update_product_child_v3_menus.py

      - name: Show changed files
        run: git status --short

      - name: Commit product child menu updates
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No product child menu updates required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/products/*/index.html
          git commit -m "apply v3 who we serve menu to product child pages"
          git push
