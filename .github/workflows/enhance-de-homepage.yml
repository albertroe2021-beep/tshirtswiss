name: Enhance German homepage

on:
  push:
    paths:
      - 'scripts/enhance_de_homepage.py.gz.b64'
      - '.github/workflows/enhance-de-homepage.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build enhanced homepage
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode scripts/enhance_de_homepage.py.gz.b64 | gzip --decompress > /tmp/enhance_de_homepage.py
          python /tmp/enhance_de_homepage.py
          grep -q 'Nachhaltige Stoffe & verantwortungsvolle Produktion' de/index.html
          grep -q 'Bekleidungsproduktion für Schweizer Unternehmen in unterschiedlichsten Branchen' de/index.html
          grep -q 'Strukturierte Qualitätskontrolle für konstant hochwertige Bekleidung' de/index.html
          grep -q 'Von der ersten Anfrage bis zur verlässlichen Nachbestellung' de/index.html
      - name: Commit homepage
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add de/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat(de): expand homepage SEO content and sustainability"
          git push origin HEAD:main
