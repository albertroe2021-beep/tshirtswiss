name: Translate German homepage faithfully

on:
  push:
    paths:
      - '.github/workflows/translate-de-homepage-faithful.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Copy English homepage and translate visible text
        shell: bash
        run: |
          cp pages/home/index.html de/home/index.html
          node