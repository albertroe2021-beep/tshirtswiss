            'Swiss-Managed Manufacturing': 'Schweizerisch geführte Produktion',
            'Swiss-Managed Clothing Manufacturing for Businesses Across Switzerland': 'Schweizerisch geführte Bekleidungsproduktion für Unternehmen in der ganzen Schweiz',
            'TShirtSwiss.ch was built for Swiss businesses that want professional clothing manufacturing without losing control of communication, quality and delivery. We combine Swiss-managed project handling with apparel production in Thailand.': 'TShirtSwiss.ch wurde für Schweizer Unternehmen geschaffen, die professionelle Bekleidungsproduktion wünschen, ohne die Kontrolle über Kommunikation, Qualität und Lieferung zu verlieren. Wir verbinden schweizerisch geführtes Projektmanagement mit Bekleidungsproduktion in Thailand.',
            'Our team helps define the product, confirm fabrics, review artwork, organise sampling, manage production, check quality and prepare orders for international delivery.': 'Unser Team unterstützt Sie bei der Produktdefinition, Stoffauswahl, Prüfung der Druckdaten, Musterentwicklung, Produktionssteuerung, Qualitätskontrolle und Vorbereitung der Bestellung für die internationale Lieferung.',
            'Whether you need staff uniforms, private label clothing, sports team apparel, promotional merchandise or a repeat production programme, our process is designed to make international manufacturing easier.': 'Ob Sie Mitarbeiteruniformen, Private-Label-Bekleidung, Sportbekleidung für Teams, Werbeartikel oder ein wiederkehrendes Produktionsprogramm benötigen: Unser Ablauf macht die internationale Fertigung einfacher.',
            'The result is a Swiss-managed clothing manufacturer based in Thailand, serving Switzerland with the quality mindset, communication and reliability Swiss buyers expect.': 'Das Ergebnis ist ein schweizerisch geführter Bekleidungshersteller in Thailand, der die Schweiz mit dem Qualitätsverständnis, der Kommunikation und der Zuverlässigkeit beliefert, die Schweizer Einkäufer erwarten.',
