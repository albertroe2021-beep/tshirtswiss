            '>View All Products<': '>Alle Produkte ansehen<',
            'Custom Product Development': 'Individuelle Produktentwicklung',
            'Custom Clothing Manufactured to Your Specifications': 'Individuelle Bekleidung nach Ihren Vorgaben gefertigt',
            'Professional apparel manufacturing starts with clear product specifications. TShirtSwiss helps define the garment type, fit, fabric weight, colour direction, branding method and finishing details before production begins. This gives Swiss businesses more control over the final product and reduces the uncertainty that often comes with international sourcing.': 'Professionelle Bekleidungsproduktion beginnt mit klaren Produktspezifikationen. TShirtSwiss unterstützt Sie dabei, Bekleidungsart, Passform, Stoffgewicht, Farbrichtung, Branding-Methode und Verarbeitungsdetails vor Produktionsbeginn festzulegen. Schweizer Unternehmen erhalten dadurch mehr Kontrolle über das Endprodukt und reduzieren die Unsicherheit, die internationale Beschaffung häufig mit sich bringt.',
            'Our production support can include cotton t-shirts, polos, hoodies, sweatshirts, jackets, workwear, corporate uniforms, sportswear, rashguards, shorts, caps, bags and promotional merchandise. For clients developing a private label range, we can also assist with custom labels, neck labels, woven patches, hang tags, packaging and repeat production planning.': 'Unsere Produktionsunterstützung umfasst unter anderem Baumwoll-T-Shirts, Poloshirts, Hoodies, Sweatshirts, Jacken, Arbeitskleidung, Firmenuniformen, Sportbekleidung, Rashguards, Shorts, Caps, Taschen und Werbeartikel. Bei der Entwicklung einer Private-Label-Kollektion unterstützen wir auch mit individuellen Etiketten, Nackenlabels, gewebten Aufnähern, Hangtags, Verpackungen und der Planung wiederkehrender Produktionen.',
            'Decoration and branding options may include screen printing, embroidery, sublimation, heat transfer, custom trims and product-specific finishing. The correct method depends on the garment, fabric, design complexity, order quantity and intended use, which is why we review these details before confirming the most suitable production route.': 'Zu den Veredelungs- und Branding-Optionen gehören Siebdruck, Stickerei, Sublimation, Transferdruck, individuelle Besätze und produktspezifische Verarbeitung. Die geeignete Methode hängt von Kleidungsstück, Stoff, Designkomplexität, Bestellmenge und Verwendungszweck ab. Deshalb prüfen wir diese Details, bevor wir den passenden Produktionsweg bestätigen.',
            'Whether the requirement is a simple branded uniform order or a more detailed OEM clothing programme, the goal remains the same: to manufacture clothing that looks professional, feels reliable and can be delivered with clear communication from sample approval through to final shipment.': 'Ob einfache Bestellung gebrandeter Uniformen oder umfangreiches OEM-Bekleidungsprogramm: Das Ziel bleibt gleich – professionell aussehende, zuverlässige Bekleidung mit klarer Kommunikation von der Musterfreigabe bis zum endgültigen Versand.',
            'Every Order Undergoes Structured Quality Control': 'Jede Bestellung durchläuft eine strukturierte Qualitätskontrolle',
            'From sample approval to final packing, we check the details that matter: measurements, stitching, fabric consistency, print and embroidery placement, finishing, packaging and shipment preparation.': 'Von der Musterfreigabe bis zur endgültigen Verpackung prüfen wir die entscheidenden Details: Masse, Nähte, Stoffkonsistenz, Platzierung von Druck und Stickerei, Verarbeitung, Verpackung und Versandvorbereitung.',
            'Sample approval before production begins': 'Musterfreigabe vor Produktionsbeginn',
            'Production checks for fabric, measurements and finishing': 'Produktionskontrollen für Stoff, Masse und Verarbeitung',
            'Final inspection before packing and shipment': 'Endkontrolle vor Verpackung und Versand',
            'Structured checks before dispatch': 'Strukturierte Kontrollen vor dem Versand',
            'Measurements, finishing and branding reviewed': 'Masse, Verarbeitung und Branding geprüft',
            'Swiss Managed': 'Schweizerisch geführt',
            'Quality and Reliability': 'Qualität und Zuverlässigkeit',
            'Why Swiss Businesses Choose TShirtSwiss': 'Warum Schweizer Unternehmen TShirtSwiss wählen',
            'Swiss buyers expect reliable communication, clear timelines and consistent product quality. TShirtSwiss is designed around those expectations, giving businesses a managed point of contact while still benefiting from competitive apparel manufacturing in Thailand. This removes much of the friction normally associated with overseas production.': 'Schweizer Einkäufer erwarten zuverlässige Kommunikation, klare Zeitpläne und gleichbleibende Produktqualität. TShirtSwiss ist auf diese Erwartungen ausgerichtet und bietet Unternehmen eine betreute Ansprechperson sowie die Vorteile wettbewerbsfähiger Bekleidungsproduktion in Thailand. Dadurch entfallen viele Reibungspunkte, die normalerweise mit Auslandsproduktion verbunden sind.',
            'Quality control begins before production starts. We help review the intended garment, fabric requirements, artwork files, branding positions and order details so the production team has a clear brief. Sampling and approval steps are used to confirm that the product direction is correct before moving into larger production quantities.': 'Die Qualitätskontrolle beginnt vor dem Produktionsstart. Wir prüfen das geplante Kleidungsstück, Stoffanforderungen, Druckdaten, Branding-Positionen und Bestelldetails, damit das Produktionsteam über ein klares Briefing verfügt. Muster- und Freigabeschritte bestätigen die Produktrichtung, bevor grössere Mengen gefertigt werden.',
            'During production, quality checks focus on details that matter to the final customer: stitching, measurements, colour consistency, print or embroidery placement, label application, packaging and overall finishing. These checks help reduce avoidable errors and make the final delivery more dependable for Swiss businesses, clubs and organisations.': 'Während der Produktion konzentrieren sich die Qualitätsprüfungen auf Details, die für Endkunden entscheidend sind: Nähte, Masse, Farbkonsistenz, Platzierung von Druck oder Stickerei, Etikettenanbringung, Verpackung und gesamte Verarbeitung. Diese Kontrollen reduzieren vermeidbare Fehler und machen die Lieferung für Schweizer Unternehmen, Vereine und Organisationen zuverlässiger.',
            'For long-term clients, quality control is also about consistency across repeat orders. Once a product, fabric and specification has been approved, we can support future production runs with the same structured process, helping companies maintain a consistent brand appearance across staff uniforms, merchandise, sportswear or private label collections.': 'Für langfristige Kunden bedeutet Qualitätskontrolle auch Konsistenz bei Nachbestellungen. Sobald Produkt, Stoff und Spezifikation freigegeben sind, begleiten wir weitere Produktionsläufe mit demselben strukturierten Ablauf. So bleibt das Markenbild bei Mitarbeiteruniformen, Merchandise, Sportbekleidung und Private-Label-Kollektionen einheitlich.',
            'Simple. Transparent. Reliable.': 'Einfach. Transparent. Zuverlässig.',
            'Our process gives Swiss businesses a clear path from idea to finished apparel, with structured consultation, sample approval, managed production, quality control and international delivery.': 'Unser Ablauf bietet Schweizer Unternehmen einen klaren Weg von der Idee bis zur fertigen Bekleidung – mit strukturierter Beratung, Musterfreigabe, betreuter Produktion, Qualitätskontrolle und internationaler Lieferung.',
            'Product Consultation': 'Produktberatung',
            'We review your requirements, quantities, product direction, branding needs and delivery expectations before production planning begins.': 'Wir prüfen Ihre Anforderungen, Mengen, Produktrichtung, Branding-Bedürfnisse und Liefererwartungen, bevor die Produktionsplanung beginnt.',
            'Sample & Approval': 'Muster & Freigabe',
            'Samples, mockups or production details are reviewed and approved so the final order follows a clear confirmed specification.': 'Muster, Mock-ups oder Produktionsdetails werden geprüft und freigegeben, damit die endgültige Bestellung einer klar bestätigten Spezifikation entspricht.',
            'Managed Production': 'Betreute Produktion',
            'Your apparel is produced through our Thailand manufacturing network while the project remains managed through clear communication.': 'Ihre Bekleidung wird über unser Produktionsnetzwerk in Thailand gefertigt, während das Projekt mit klarer Kommunikation betreut wird.',
            'Quality Check': 'Qualitätsprüfung',
            'Finished garments are checked for construction, measurements, branding, finishing and packing requirements before release.': 'Fertige Kleidungsstücke werden vor der Freigabe auf Verarbeitung, Masse, Branding, Ausführung und Verpackungsanforderungen geprüft.',
            'International Delivery': 'Internationale Lieferung',
            'Orders are packed and prepared for worldwide shipping, including delivery support for Switzerland, Europe and international destinations.': 'Bestellungen werden verpackt und für den weltweiten Versand vorbereitet, einschliesslich Lieferunterstützung für die Schweiz, Europa und internationale Ziele.',
            'Manufacturing Process': 'Produktionsablauf',
            'From Concept to Delivery': 'Von der Idee bis zur Lieferung',
            'The TShirtSwiss process is built to make custom apparel manufacturing easier for Swiss businesses. It begins with an enquiry, where we review the type of clothing required, the intended use, branding requirements, quantities, preferred fabrics, sizing needs and any delivery deadlines that may affect the project.': 'Der TShirtSwiss-Ablauf erleichtert Schweizer Unternehmen die Herstellung individueller Bekleidung. Er beginnt mit einer Anfrage, bei der wir Bekleidungsart, Verwendungszweck, Branding-Anforderungen, Mengen, bevorzugte Stoffe, Grössenanforderungen und Liefertermine prüfen, die das Projekt beeinflussen können.',
            'Once the project direction is understood, we help prepare the production brief and quotation. This may include fabric recommendations, garment options, branding methods, sample requirements and estimated production timelines. For more detailed projects, artwork preparation and mockups can be used to confirm how the final product should look before sampling.': 'Sobald die Projektrichtung feststeht, erstellen wir gemeinsam das Produktionsbriefing und die Offerte. Dazu können Stoffempfehlungen, Bekleidungsoptionen, Branding-Methoden, Musteranforderungen und geschätzte Produktionszeiten gehören. Bei detaillierteren Projekten helfen Druckdaten und Mock-ups dabei, das gewünschte Endergebnis vor der Musterentwicklung zu bestätigen.',
            'After sample approval, the order moves into production. During this stage, the factory follows the approved specification while the project is managed through production updates, quality checks, packing preparation and shipment coordination. This gives clients a more transparent view of what is happening without needing to manage the factory directly.': 'Nach der Musterfreigabe geht die Bestellung in Produktion. Die Fabrik folgt der bestätigten Spezifikation, während wir das Projekt mit Produktionsupdates, Qualitätsprüfungen, Verpackungsvorbereitung und Versandkoordination betreuen. Kunden erhalten dadurch einen transparenten Einblick, ohne die Fabrik direkt steuern zu müssen.',
            'When production is complete, the order is checked, packed and prepared for international delivery. For businesses that require ongoing supply, we can also support repeat orders and long-term manufacturing programmes, helping maintain consistent products across future staff uniforms, teamwear, promotional campaigns or private label collections.': 'Nach Abschluss der Produktion wird die Bestellung geprüft, verpackt und für die internationale Lieferung vorbereitet. Unternehmen mit laufendem Bedarf unterstützen wir auch bei Nachbestellungen und langfristigen Produktionsprogrammen, damit Mitarbeiteruniformen, Teambekleidung, Werbekampagnen und Private-Label-Kollektionen dauerhaft konsistent bleiben.',
            'Ready to Manufacture Clothing for Your Business?': 'Bereit, Bekleidung für Ihr Unternehmen produzieren zu lassen?',
            'Speak with our Swiss-managed team to discuss your project, receive practical production advice and request a tailored quotation for your apparel order.': 'Besprechen Sie Ihr Projekt mit unserem schweizerisch geführten Team, erhalten Sie praxisnahe Produktionsberatung und fordern Sie eine individuelle Offerte für Ihre Bekleidungsbestellung an.',
            '>Request Your Quote<': '>Ihre Offerte anfordern<',
            'Swiss-managed apparel manufacturing in Thailand for Swiss businesses, teams, organisations and brands. We support custom uniforms, workwear, sportswear, promotional merchandise and private label clothing with clear communication, quality control and international delivery.': 'Schweizerisch geführte Bekleidungsproduktion in Thailand für Schweizer Unternehmen, Teams, Organisationen und Marken. Wir unterstützen individuelle Uniformen, Arbeits- und Sportbekleidung, Werbeartikel und Private-Label-Bekleidung mit klarer Kommunikation, Qualitätskontrolle und internationaler Lieferung.',
            '>Product Planning<': '>Produktplanung<',
