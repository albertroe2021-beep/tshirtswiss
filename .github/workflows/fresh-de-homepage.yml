            'Industry Apparel Manufacturing': 'Bekleidungsproduktion für Branchen',
            'Custom Clothing Solutions for Swiss Businesses, Teams and Organisations': 'Individuelle Bekleidungslösungen für Schweizer Unternehmen, Teams und Organisationen',
            'Every industry has different requirements when it comes to branded clothing. A construction company may need durable workwear that stands up to daily site use, while a healthcare provider may require comfortable uniforms that look professional across long shifts. A hotel, restaurant or event company may need apparel that communicates the brand clearly from the moment customers arrive.': 'Jede Branche hat unterschiedliche Anforderungen an gebrandete Bekleidung. Ein Bauunternehmen benötigt möglicherweise strapazierfähige Arbeitskleidung für den täglichen Einsatz auf der Baustelle, während ein Gesundheitsdienstleister bequeme Uniformen braucht, die auch während langer Schichten professionell wirken. Hotels, Restaurants oder Eventunternehmen benötigen Bekleidung, die ihre Marke vom ersten Kundenkontakt an klar vermittelt.',
            'TShirtSwiss supports Swiss businesses across construction, healthcare, hospitality, corporate, fitness, events, ecommerce and private label markets. Our role is to help translate each industry requirement into practical apparel specifications, including fabric type, fit, garment construction, branding method, colour selection and packaging.': 'TShirtSwiss unterstützt Schweizer Unternehmen aus Bau, Gesundheitswesen, Gastronomie und Hotellerie, Firmenbekleidung, Fitness, Events, E-Commerce und Private Label. Wir übertragen die Anforderungen jeder Branche in praktische Bekleidungsspezifikationen – von Stoffart, Passform und Verarbeitung bis zu Branding-Methode, Farbwahl und Verpackung.',
            'For sports clubs, gyms and combat sports teams, we can support performance-focused clothing such as training tops, rashguards, shorts, teamwear and promotional merchandise. For corporate clients, we can help create polished staff uniforms, branded polos, jackets and clothing programmes that remain consistent across departments and locations.': 'Für Sportvereine, Fitnessstudios und Kampfsportteams bieten wir leistungsorientierte Bekleidung wie Trainingstops, Rashguards, Shorts, Teambekleidung und Werbeartikel. Für Firmenkunden entwickeln wir professionelle Mitarbeiteruniformen, gebrandete Poloshirts, Jacken und Bekleidungsprogramme mit einem einheitlichen Erscheinungsbild über Abteilungen und Standorte hinweg.',
            'By combining Swiss-managed communication with factory-direct production in Thailand, we make it easier for organisations across Switzerland to source professional clothing without having to manage overseas suppliers alone. The result is apparel that fits the purpose, reflects the brand and can be reordered as the business grows.': 'Durch die Verbindung schweizerisch geführter Kommunikation mit direkter Produktion in Thailand erleichtern wir Organisationen in der ganzen Schweiz die Beschaffung professioneller Bekleidung, ohne dass sie ausländische Lieferanten selbst steuern müssen. Das Ergebnis ist zweckmässige Bekleidung, die die Marke widerspiegelt und bei wachsendem Bedarf nachbestellt werden kann.',
            'Custom Clothing We Manufacture': 'Individuelle Bekleidung, die wir fertigen',
            'From custom t-shirts and polos through to premium corporate uniforms, workwear, sportswear and private label collections, we manufacture high-quality apparel tailored to your brand, industry and production requirements.': 'Von individuellen T-Shirts und Poloshirts über hochwertige Firmenuniformen, Arbeits- und Sportbekleidung bis zu Private-Label-Kollektionen fertigen wir hochwertige Bekleidung, abgestimmt auf Ihre Marke, Branche und Produktionsanforderungen.',
            '>Garments<': '>Bekleidung<',
            'Custom apparel and product programmes for businesses, teams and brands.': 'Individuelle Bekleidung und Produktprogramme für Unternehmen, Teams und Marken.',
            'Professional apparel for company teams, offices and customer-facing staff.': 'Professionelle Bekleidung für Unternehmensteams, Büros und Mitarbeitende mit Kundenkontakt.',
            'Teamwear, activewear and performance clothing for clubs and fitness brands.': 'Teambekleidung, Activewear und Performance-Bekleidung für Vereine und Fitnessmarken.',
