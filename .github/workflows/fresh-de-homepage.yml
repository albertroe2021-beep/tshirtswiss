          }

          for old, new in sorted(replacements.items(), key=lambda item: len(item[0]), reverse=True):
              source = source.replace(old, new)

          target = Path('de/home/index.html')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(source, encoding='utf-8')

          Path('.github/workflows/fresh-de-homepage.yml').unlink()
      - name: Commit generated homepage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add de/home/index.html .github/workflows/fresh-de-homepage.yml
          git commit -m "feat(de): publish fresh Swiss German homepage"
          git push origin HEAD:tshirtswiss-v2
