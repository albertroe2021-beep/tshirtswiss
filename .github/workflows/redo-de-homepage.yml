name: Rebuild German homepage from exact English master

on:
  push:
    paths:
      - '.github/workflows/redo-de-homepage.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Copy exact English homepage and translate